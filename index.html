<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sổ Lớp — Quản lý trung tâm</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;overflow-x:hidden}
body{overflow-x:hidden}
*,*::before,*::after{touch-action:manipulation}
:root{
  --p1:#e8590c; --p2:#f76707; --p3:#fa5252; --p4:#fab005;
  --grad:linear-gradient(135deg,#ff6a00 0%,#ff922b 45%,#ff5e62 100%);
  --grad-soft:linear-gradient(135deg,#fff1e0,#ffe3c2 60%,#ffd0a0);
  --ink:#241d3d; --muted:#8f8aa5; --bg:#f4f2fa; --card:#fff;
  --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2; --amber:#d97706; --amber-bg:#fef3c7;
  --r:20px; --sh:0 8px 24px rgba(247,103,7,.12);
  --glowc:var(--glowc); --shc:rgba(150,70,0,.22); --bodybg:#f3e2c8;
}
[data-theme="red"]{
  --p1:#c92a2a; --p2:#e03131; --p3:#f03e3e; --p4:#ff8787;
  --grad:linear-gradient(135deg,#c92a2a 0%,#e03131 45%,#ff6b6b 100%);
  --grad-soft:linear-gradient(135deg,#ffe3e3,#ffc9c9 60%,#ffa8a8);
  --sh:0 8px 24px rgba(224,49,49,.12);
  --glowc:rgba(224,49,49,.45); --shc:rgba(150,20,20,.22); --bodybg:#f6dcdc;
}
[data-theme="green"]{
  --p1:#099268; --p2:#0ca678; --p3:#12b886; --p4:#94d82d;
  --grad:linear-gradient(135deg,#099268 0%,#0ca678 45%,#51cf66 100%);
  --grad-soft:linear-gradient(135deg,#d3f9d8,#b2f2bb 60%,#8ce99a);
  --sh:0 8px 24px rgba(12,166,120,.12);
  --glowc:rgba(12,166,120,.45); --shc:rgba(20,120,80,.22); --bodybg:#dcefdd;
}
[data-theme="blue"]{
  --p1:#1864ab; --p2:#1971c2; --p3:#1c7ed6; --p4:#66d9e8;
  --grad:linear-gradient(135deg,#1864ab 0%,#1971c2 45%,#4dabf7 100%);
  --grad-soft:linear-gradient(135deg,#d0ebff,#a5d8ff 60%,#74c0fc);
  --sh:0 8px 24px rgba(25,113,194,.12);
  --glowc:rgba(25,113,194,.45); --shc:rgba(20,60,120,.22); --bodybg:#d9e8f5;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bodybg);color:var(--ink);font-size:15px;display:flex;justify-content:center}
/* ===== phone frame ===== */
.phone{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);position:relative;overflow:clip;flex:none;align-self:flex-start}
@media(min-width:480px){.phone{margin:0;box-shadow:0 0 60px var(--shc)}}
/* ===== appbar ===== */
.appbar{background:var(--grad);color:#fff;padding:22px 18px 30px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.appbar::before,.appbar::after{content:'';position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}
.appbar::before{width:170px;height:170px;background:#fff;top:-70px;right:-50px;opacity:.18}
.appbar::after{width:110px;height:110px;background:#fde68a;bottom:-50px;left:30px;opacity:.25}
.appbar .hello{font-size:13px;opacity:.9;position:relative}
.appbar h1{font-size:23px;font-weight:800;letter-spacing:.2px;position:relative;margin-top:2px}
.appbar .date{font-size:12.5px;opacity:.85;margin-top:4px;position:relative}
/* ===== main ===== */
#view{padding:16px 14px 120px;margin-top:-18px;position:relative;z-index:2}
/* ===== month navigator ===== */
.mnav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:8px;box-shadow:var(--sh);margin-bottom:12px}
.mnav button{border:0;background:var(--grad-soft);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--p1);font-weight:700}
.mnav b{font-size:15px}
/* ===== KPI cards ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.kpi{padding:11px 10px}
.kpi{background:var(--card);border-radius:var(--r);padding:13px 12px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:7px}
.kpi .ic svg{width:19px;height:19px}
.g1{background:linear-gradient(135deg,var(--p1),var(--p2))} .g2{background:linear-gradient(135deg,var(--p2),var(--p3))}
.g3{background:linear-gradient(135deg,var(--p3),var(--p4))} .g4{background:linear-gradient(135deg,var(--p1),var(--p4))}
.kpi .lb{font-size:11px;color:var(--muted)}
.kpi .vl{font-size:19px;font-weight:800;margin:1px 0 5px}
.kpi .vl small{font-size:12px;font-weight:600;color:var(--muted)}
.delta{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.delta.up{background:var(--green-bg);color:var(--green)}
.delta.down{background:var(--red-bg);color:var(--red)}
.delta.flat{background:#f1f0f7;color:var(--muted)}
/* ===== panels ===== */
.panel{background:var(--card);border-radius:var(--r);padding:15px 14px;box-shadow:var(--sh);margin-top:12px}
.panel h3{font-size:15px;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
/* ===== bar chart ===== */
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bval{font-size:10px;font-weight:700;color:var(--p1)}
.bar{width:100%;max-width:38px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,var(--p2),var(--p3));min-height:6px;position:relative;transition:height .4s}
.bcol.cur .bar{background:var(--grad);box-shadow:0 4px 14px var(--glowc)}
.barstack{width:100%;border-radius:8px;background:#ece7f5;position:relative;overflow:hidden}
.barstack .seg-t{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,var(--p2),var(--p3));border-radius:8px}
.bcol.cur .seg-t{background:var(--grad);box-shadow:0 4px 14px var(--glowc)}
.legend{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.lg-t{background:var(--grad)}
.lg-c{background:#e3ddf0}
.lg-sum{margin-left:auto}
.lg-sum b{color:var(--p1)}
.blb{font-size:10.5px;color:var(--muted);font-weight:600}
.bcol.cur .blb{color:var(--p1);font-weight:800}
/* ===== chips (class selector) ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #e4e0f2;background:#fff;border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--glowc)}
/* ===== attendance ===== */
.sumline{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin:10px 0;font-size:14px;font-weight:600}
.sumline .n{background:var(--grad);color:#fff;border-radius:12px;padding:5px 12px;font-size:13px}
.stu{background:var(--card);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);margin-bottom:9px;display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:15px;background:var(--grad-soft);color:var(--p1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.stu .inf{flex:1;min-width:0}
.stu .inf b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .inf span{font-size:12px;color:var(--muted)}
.tgs{display:flex;gap:6px}
.tg{width:38px;height:38px;border-radius:12px;border:1.5px solid #e7e3f4;background:#faf9fd;font-size:16px;cursor:pointer;color:var(--muted)}
.tg.on-co{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.tg.on-vang{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.tg.on-nghi{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.stickybtn{position:sticky;bottom:96px;z-index:5;margin-top:12px}
.btn{background:var(--grad);color:#fff;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 8px 20px var(--glowc)}
.btn:active{transform:scale(.98)}
/* ===== schedule ===== */
.weekstrip{display:flex;gap:6px;margin-bottom:12px}
.wday{flex:1;border:0;background:var(--card);border-radius:14px;padding:9px 0;box-shadow:var(--sh);cursor:pointer;color:var(--muted)}
.wday .d1{font-size:10.5px;font-weight:700}
.wday .d2{font-size:15px;font-weight:800;margin-top:2px}
.wday.on{background:var(--grad);color:#fff}
.wday.today:not(.on) .d2{color:var(--p1)}
.ev{background:var(--card);border-radius:16px;padding:13px 14px;box-shadow:var(--sh);margin-bottom:10px;display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.ev::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.ev .tm{background:var(--grad-soft);border-radius:12px;padding:8px 10px;text-align:center;flex:none;min-width:74px}
.ev .tm b{display:block;font-size:13px;color:var(--p1)}
.ev .tm span{font-size:11px;color:var(--muted)}
.ev .inf b{font-size:14.5px}
.ev .inf span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
/* ===== tuition ===== */
.prog{height:10px;background:#efeaf9;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s}
.frow{background:var(--card);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);margin-bottom:9px;display:flex;align-items:center;gap:10px}
.frow .inf{flex:1;min-width:0}
.frow .inf b{display:block;font-size:14px}
.frow .inf span{font-size:12px;color:var(--muted)}
.frow .amt{text-align:right}
.frow .amt b{font-size:13.5px;display:block}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-top:3px}
.b-dong{background:var(--green-bg);color:var(--green)}
.b-chua{background:var(--red-bg);color:var(--red)}
.mini{background:#fff;border:1.5px solid var(--p2);color:var(--p1);border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;flex:none}
/* ===== student list ===== */
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);margin-bottom:10px}
.searchbar input{border:0;outline:0;font-size:16px;flex:1;background:none;color:var(--ink)}
.srow{background:var(--card);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);margin-bottom:9px;display:flex;align-items:center;gap:10px;cursor:pointer}
/* ===== tabbar ===== */
.tabbar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:min(406px,calc(100% - 24px));background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-radius:26px;box-shadow:0 10px 34px var(--shc);display:flex;padding:8px;z-index:50}
.tab{flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10px;font-weight:600}
.tab .ti{font-size:20px;width:44px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:14px;transition:.2s}
.tab.on{color:var(--p1)}
.tab.on .ti{background:var(--grad);box-shadow:0 4px 12px var(--glowc)}
.tab .ti{color:var(--muted)}
.tab.on .ti{color:#fff}
.tab .ti svg{width:22px;height:22px}
/* ===== modal / toast ===== */
.modal{position:fixed;inset:0;z-index:100;display:none}
.modal.open{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(30,15,60,.5);backdrop-filter:blur(3px)}
.modal-box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 30px;max-height:88dvh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translate(-50%,30px);opacity:.5}}
.modal-box h3{font-size:17px;margin-bottom:14px}
.modal-box .grab{width:44px;height:5px;border-radius:99px;background:#e4e0f2;margin:0 auto 14px}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 5px;font-weight:600}
input,select,textarea{border:1.5px solid #e7e3f4;border-radius:13px;padding:11px 12px;font-size:16px;width:100%;background:#faf9fd;color:var(--ink);outline:none}
textarea{font-family:inherit;line-height:1.55;font-size:15px}
input:focus,select:focus{border-color:var(--p2)}
.mrow{display:flex;gap:10px;margin-top:16px}
.mrow .btn{padding:13px}
.btn-ghost{background:#f1eff8;color:var(--ink);border:0;border-radius:16px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;flex:1}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #eee9f8;font-size:14px}
.kv span{color:var(--muted)}
.warnbox{background:var(--red-bg);color:var(--red);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;margin:8px 0}
.sched-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f4f1fa}
.sched-row select,.sched-row input[type=time]{border:1.5px solid #ece7f7;border-radius:10px;padding:7px 4px;font-size:16px;background:#fff;color:var(--ink)}
.sched-row select{flex:1.3;min-width:0} .sched-row input{flex:1;min-width:0}
.hp-hist{margin-top:6px}
.hp-hist .hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f4f1fa;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);background:#241d3d;color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:92%;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.demo-tag{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;z-index:60;display:none}
.secttl{font-size:15px;font-weight:800;margin:14px 2px 10px}
.h3-ic{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--p1)}
.h3-ic svg{width:18px;height:18px}
.btn svg{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
.tg svg{width:15px;height:15px;vertical-align:-2px}
.searchbar .h3-ic{margin-right:0;color:var(--muted)}
.searchbar .h3-ic svg{width:17px;height:17px}
.upcard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #f4f1fa}
.upcard:last-child{border-bottom:0}
.upday{font-size:11.5px;font-weight:700;color:var(--p1);margin-bottom:2px}
.upname{font-size:16px;font-weight:800}
.upmeta{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.upmeta svg{width:14px;height:14px}
.upmeta .dot{opacity:.5}
.upcount{flex:none;font-size:12px;font-weight:700;color:var(--p1);background:var(--grad-soft);padding:7px 13px;border-radius:99px;white-space:nowrap}
.linklike{border:0;background:none;color:var(--p1);font-weight:700;font-size:13px;cursor:pointer;padding:4px}
.lrow{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid #f4f1fa;font-size:13.5px}
.lrow:last-child{border-bottom:0}
.lrow b{color:var(--p1);font-size:13px;white-space:nowrap;flex:none}
.lrow span{color:var(--ink)}
input[type=date]{min-height:48px}
.gearbtn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.22);cursor:pointer;display:flex;align-items:center;justify-content:center}
.gearbtn svg{width:20px;height:20px}
.gearbtn:active{transform:scale(.94)}
.sethead{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 12px}
.sethead b{font-size:17px}
.backbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh);font-size:22px;font-weight:800;color:var(--p1);cursor:pointer;line-height:1}
.setrow{display:flex;gap:8px}
.setrow input{flex:1;width:auto}
.setrow .btn{flex:none;width:auto;padding:11px 18px}
.lockscreen{position:fixed;inset:0;z-index:200;background:var(--grad);display:flex;align-items:center;justify-content:center;padding:24px}
.lockscreen[hidden]{display:none}
.lock-card{text-align:center;color:#fff;max-width:300px;width:100%}
.lock-hello{font-size:14px;opacity:.9}
.lock-card h2{font-size:24px;margin:6px 0 4px}
.lock-card p{font-size:13px;opacity:.85;margin:0 0 18px}
.pindots{display:flex;gap:14px;justify-content:center;margin-bottom:22px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);transition:.15s}
.pindots i.on{background:#fff;border-color:#fff}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pinpad button{aspect-ratio:1.7;border:0;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;font-size:22px;font-weight:700;cursor:pointer}
.pinpad button:active{background:rgba(255,255,255,.38)}
.lockreset{border:0;background:none;color:#fff;font-size:13px;opacity:.85;cursor:pointer;text-decoration:underline}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.theme-sw{border:2px solid #f0ebf9;background:#fff;border-radius:16px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink)}
.theme-sw i{width:38px;height:38px;border-radius:12px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.theme-sw.on{border-color:var(--p2);box-shadow:var(--sh)}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}

/* ===== tính năng mới ===== */
.stu{flex-wrap:wrap}
.learnrow{display:flex;gap:8px;width:100%;margin-top:9px;padding-top:9px;border-top:1px dashed #efeaf9}
.learnrow input{padding:8px 10px;font-size:14px;border-radius:10px}
.learnrow .diem-in{flex:0 0 78px;text-align:center}
.learnrow .nx-in{flex:1}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menucard{border:0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 12px;text-align:left;cursor:pointer}
.menucard .ic{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:8px}
.menucard .ic svg{width:20px;height:20px}
.menucard b{display:block;font-size:14px}
.menucard span{font-size:11.5px;color:var(--muted)}
.zbtn{flex:none;border:0;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0068ff,#00a2ff);box-shadow:0 4px 12px rgba(0,104,255,.3)}
.zbtn:active{transform:scale(.97)}
.msgpreview{background:#f4f8ff;border:1.5px dashed #a8ccff;color:#123;border-radius:14px;padding:12px 14px;font-size:13px;white-space:pre-wrap;line-height:1.55}
.receipt{border:1.5px dashed #d9d2ee;border-radius:16px;padding:16px 14px;background:#fffdf7}
.rc-head{text-align:center;font-weight:800;font-size:15px;color:var(--p1)}
.rc-title{text-align:center;font-weight:800;font-size:19px;margin-top:6px;letter-spacing:.5px}
.rc-no{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 10px}
.rc-amt{text-align:center;font-size:26px;font-weight:800;color:var(--green);margin:12px 0 4px}

<script>
/* =====================================================================
 * App "Sổ Lớp" — bản mobile 2026
 * ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyMIPBTncWS9QLPk_19TGCskTO15I7sUYQFZIpr25dhL2Ka30g_FjQWVR3lUAtUv0SrTg/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money = n => (Number(n) || 0).toLocaleString('vi-VN');
const pad2 = n => ('0' + n).slice(-2);
const ymOf = d => { d = d instanceof Date ? d : new Date(d); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
const curYM = () => ymOf(new Date());
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
function addMonths(ym, n) { let y = +ym.slice(0,4), m = +ym.slice(5,7) - 1 + n; y += Math.floor(m/12); m = ((m%12)+12)%12; return y + '-' + pad2(m+1); }
function monthName(ym) { return 'Tháng ' + (+ym.slice(5,7)) + '/' + ym.slice(0,4); }
function dateVI(ds) { const [y,m,d] = ds.split('-').map(Number); return 'Thứ ' + ['','2','3','4','5','6','7',''][0] + ''; } // (không dùng)
function fmtDateVI(ds) {
  const d = new Date(ds + 'T00:00:00');
  const t = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][d.getDay()];
  return t + ', ' + pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + '/' + d.getFullYear();
}
const THU_NAMES = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
const THU_FULL = {'Thứ 2':'Thứ hai','Thứ 3':'Thứ ba','Thứ 4':'Thứ tư','Thứ 5':'Thứ năm','Thứ 6':'Thứ sáu','Thứ 7':'Thứ bảy','Chủ nhật':'Chủ nhật'};
const thuFull = t => THU_FULL[t] || t;
function dayLabelFull(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  const x = new Date(d); x.setHours(0,0,0,0);
  const diff = Math.round((x - t) / 864e5);
  const ds = pad2(x.getDate()) + '/' + pad2(x.getMonth()+1) + '/' + String(x.getFullYear()).slice(2);
  const wd = thuFull(THU_NAMES[(x.getDay() + 6) % 7]);
  if (diff === 0) return 'Hôm nay (' + ds + ')';
  if (diff === 1) return 'Ngày mai (' + ds + ')';
  return wd + ' (' + ds + ')';
}
/* Chuẩn hóa giờ: "17:00" hoặc chuỗi Date "Sat Dec 30 1899 17:00:00 GMT+0706 ..." → "17:00" */
function normTime(t) {
  const m = /(\d{1,2}):(\d{2})(?::\d{2})?/.exec(String(t || ''));
  if (!m) return String(t || '');
  return String(+m[1]).padStart(2, '0') + ':' + m[2];
}
/* dd/mm/yyyy cho chuỗi yyyy-MM-dd */
function dmy(ds) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(ds || '');
  return m ? m[3] + '/' + m[2] + '/' + m[1] : (ds || '—');
}
const initials = name => name.trim().split(/\s+/).slice(-2).map(w => w[0]).join('').toUpperCase();
/* Chuẩn hóa "tháng" từ server: chấp nhận cả 'yyyy-MM' lẫn chuỗi Date kiểu "Thu Oct 01 2026...".
 * Parse trực tiếp chuỗi, KHÔNG qua new Date() để tránh lệch tháng do múi giờ. */
const MON2N = {Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
const normYM = s => { s = String(s || ''); let m = /^(\d{4})-(\d{2})/.exec(s); if (m) return m[1] + '-' + m[2];
  m = /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+(\d{4})/.exec(s);
  return m ? m[2] + '-' + MON2N[m[1]] : ''; };

let D = null, DEMO = false;
const S = { tab:'tongquan', month:curYM(), cls:'L01', date:todayStr(), dayIdx:(new Date().getDay()+6)%7, feeF:'all', q:'', fcls:'all', att:{}, learn:{}, baiTap:'', ztpl:'ketqua', zcls:'all', wdate:todayStr() };

function api(fn, args) {
  args = args || [];
  if (window.google && google.script && google.script.run && google.script.run[fn]) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve)
        .withFailureHandler(err => reject(new Error((err && err.message) || err)))[fn](...args);
    });
  }
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({fn, args}) })
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.error || 'Lỗi server'); return j.data; });
}
async function load() {
  try {
    D = await api('getInitData');
    if (!D || !D.hocVien) throw new Error('empty');
  } catch(e) { DEMO = true; D = genDemo(); $('demoTag').style.display = 'block'; }
  if (!D.lopHoc.some(c => c.maLop === S.cls)) S.cls = D.lopHoc[0] ? D.lopHoc[0].maLop : null;
  ['hocTap','buoiHoc','thuChi','nhanSu','chamCong','nhatKyGui'].forEach(k => { if (!Array.isArray(D[k])) D[k] = []; });
}

  const hocVien = names.map((n,i) => ({maHV:'HV'+pad2(i+1).padStart(3,'0'),hoTen:n,sdt:'09012345'+pad2(i+1),maLop:lopHoc[Math.floor(i/3)].maLop,ngaySinh:'',ghiChu:''}));
  const diemDanh = [], hocPhi = [];
  const rnd = (a => () => (a = (a*9301+49297)%233280)/233280)(7);

      chamCong.push({ ngay: dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()), maNV: nv, maLop: l.maLop, soGio: 1.5, ghiChu: '' });
    });

  return {hocVien, lopHoc, diemDanh, hocPhi, lichHoc, hocTap, buoiHoc, thuChi, nhanSu, chamCong, nhatKyGui: []};
}

/* ---------- thống kê ---------- */
const clsOf = ma => D.lopHoc.find(c => c.maLop === ma) || {};

function monthStats(ym) {
  let thu = 0, phai = 0, tot = 0, co = 0;
  const seen = new Set();

  D.diemDanh.forEach(d => { if ((d.ngay||'').slice(0,7) === ym) { tot++; if (d.trangThai === 'Có mặt') co++; } });

function deltaHTML(cur, prev, suffix) {

/* ---------- 3. LỊCH HỌC ---------- */
function weekDates() {
  const now = new Date(), mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  return Array.from({length:7}, (_,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function vLich() {
  const days = weekDates(), tS = todayStr();
  const groups = days.map((d, i) => {
    const ds = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
    const evs = D.lichHoc.filter(l => l.thu === THU_NAMES[i])
      .sort((a,b) => normTime(a.gioBatDau).localeCompare(normTime(b.gioBatDau)));
    return { d, ds, i, evs };
  }).filter(g => g.evs.length);
  const html = groups.map(g => {
    const isT = g.ds === tS;
    const rows = g.evs.map(e => { const c = clsOf(e.maLop);
      return `<div class="lrow"><b>${normTime(e.gioBatDau)} - ${normTime(e.gioKetThuc)}</b><span><b style="color:var(--ink)">${esc(c.tenLop||e.maLop)}</b></span></div>`; }).join('');
    return `<div class="secttl" style="${isT ? 'color:var(--p1)' : ''}">${thuFull(THU_NAMES[g.i])}, ${pad2(g.d.getDate())}/${pad2(g.d.getMonth()+1)}${isT ? ' · hôm nay' : ''}</div>`
      + `<div class="panel" style="margin-top:0;padding:4px 14px">${rows}</div>`;
  }).join('');
  return `<div class="secttl" style="margin-top:0">Lịch tuần này</div>` + (html || '<div class="empty">Chưa có lịch học</div>');
}

/* ---------- 4. HỌC PHÍ ---------- */
function vHocPhi() {
  const rows = D.hocPhi.filter(h => normYM(h.thang) === S.month);
  const byHV = {}; rows.forEach(h => { if (!byHV[h.maHV] || h.trangThai === 'Đã đóng') byHV[h.maHV] = h; });
  let thu = 0, phai = 0, dong = 0;
  let hvs = D.hocVien.filter(h => {
    const r = byHV[h.maHV]; const stt = r ? r.trangThai : 'Chưa đóng';
    return S.feeF === 'all' || (S.feeF === 'dong' ? stt === 'Đã đóng' : stt !== 'Đã đóng');
  });
  D.hocVien.forEach(h => { const r = byHV[h.maHV]; const amt = r ? +r.soTien : +clsOf(h.maLop).hocPhi || 0;
    phai += amt; if (r && r.trangThai === 'Đã đóng') { thu += amt; dong++; } });
  const pct = phai ? Math.round(thu/phai*100) : 0;
  const debts = debtByHV();
  const quaHan = Object.values(debts).reduce((s, d) => s + d.thangCu, 0);
  const noCount = Object.keys(debts).filter(k => debts[k].thangCu > 0).length;

function hoursBetween(b, e) {
  const nb = normTime(b), ne = normTime(e);
  const mb = /^(\d+):(\d+)$/.exec(nb), me = /^(\d+):(\d+)$/.exec(ne);
  if (!mb || !me) return 1.5;
  const h = ((+me[1]) * 60 + (+me[2]) - ((+mb[1]) * 60 + (+mb[2]))) / 60;
  return h > 0 ? Math.round(h * 10) / 10 : 1.5;
}

  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove(); return ok;
  }
}

function fillTpl(tpl, vars) {

  let out = lines.join('\n');
  Object.keys(vars).forEach(k => { out = out.split('{' + k + '}').join(vars[k]); });
  return out;

let _compose = null;
function openCompose(maHV, loai, msg) {
  const h = hvOf(maHV);
  _compose = { maHV, loai };
  openModal(`<h3>Soạn tin gửi phụ huynh</h3>
    <div class="sub">${esc(h.hoTen)} · ${esc(h.sdt || 'chưa có SĐT')} — nội dung dưới đây sửa thoải mái, bản này mới là bản được copy để gửi.</div>

    <div class="mrow"><button class="btn-ghost" onclick="closeModal()">Hủy</button>
    <button class="btn" style="flex:2" onclick="doComposeSend()">Copy + Mở Zalo</button></div>`);
}
async function doComposeSend() {
  if (!_compose) return;
  const { maHV, loai } = _compose, h = hvOf(maHV);
  const phone = normPhone(h.sdt);
  if (!phone) { toast('Chưa có SĐT phụ huynh'); return; }
  const msg = $('composeText').value;
  await copyText(msg);
  try {
    if (!DEMO) await api('logSend', [{ maHV, loai, noiDung: msg }]);
    (D.nhatKyGui = D.nhatKyGui || []).push({ thoiGian: todayStr(), maHV, loai, noiDung: msg });
  } catch (e) {}
  _compose = null; closeModal();
  window.open('https://zalo.me/' + phone, '_blank');
  toast('Đã copy tin — dán vào Zalo là gửi');
  setTimeout(render, 500);
}
function sentToday(maHV, loai) {
  const td = todayStr();
  return (D.nhatKyGui || []).some(g => g.maHV === maHV && g.loai === loai && String(g.thoiGian || '').slice(0, 10) === td);
}
async function sendZalo(maHV) {
  const h = hvOf(maHV);
  if (!normPhone(h.sdt)) { toast('Học viên chưa có SĐT phụ huynh'); return; }
  openCompose(maHV, S.ztpl, buildZaloMsg(S.ztpl, h));
}
function sendZaloDebt(maHV) { S.ztpl = 'nhacphi'; sendZalo(maHV); }
function vZalo() {

/* ---- 7. CHẤM CÔNG & TÍNH LƯƠNG GIÁO VIÊN ---- */
function salaryMonth(ym) {
  const rows = (D.nhanSu || []).map(s => {
    const logs = (D.chamCong || []).filter(w => w.maNV === s.maNV && (w.ngay || '').slice(0, 7) === ym);
    const ca = logs.length, gio = logs.reduce((t, w) => t + (+w.soGio || 0), 0);
    const luongCa = ca * (+s.luongCa || 0);
    return { s, ca, gio, luongCa, phuCap: ca ? (+s.phuCap || 0) : 0, tong: luongCa + (ca ? (+s.phuCap || 0) : 0) };
  });
  return { rows, tong: rows.reduce((t, r) => t + r.tong, 0), tongCa: rows.reduce((t, r) => t + r.ca, 0), tongGio: rows.reduce((t, r) => t + r.gio, 0) };
}
function worklogOf(ngay, maNV, maLop) { return (D.chamCong || []).find(w => w.ngay === ngay && w.maNV === maNV && w.maLop === maLop); }
async function chamCa(maLop, maNV) {
  const ses = D.lichHoc.find(l => l.maLop === maLop && l.thu === THU_NAMES[(new Date(S.wdate + 'T00:00:00').getDay() + 6) % 7]);
  const gio = ses ? hoursBetween(ses.gioBatDau, ses.gioKetThuc) : 1.5;
  const rec = { ngay: S.wdate, maNV, maLop, soGio: gio, ghiChu: '' };
  try {
    if (!DEMO) await api('saveWorklog', [rec]);
    const i = (D.chamCong || []).findIndex(w => w.ngay === rec.ngay && w.maNV === maNV && w.maLop === maLop);
    if (i >= 0) D.chamCong[i] = rec; else (D.chamCong = D.chamCong || []).push(rec);
    toast('Đã chấm công ca dạy'); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}
async function huyChamCa(maLop, maNV) {
  try {
    if (!DEMO) await api('deleteWorklog', [{ ngay: S.wdate, maNV, maLop }]);
    D.chamCong = (D.chamCong || []).filter(w => !(w.ngay === S.wdate && w.maNV === maNV && w.maLop === maLop));
    toast('Đã hủy chấm công'); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}

    const wl = worklogOf(S.wdate, st.maNV, l.maLop);

      ${wl ? `<span class="badge b-dong">Đã chấm · ${wl.soGio}h</span><button class="mini" style="border-color:var(--red-bg);color:var(--red)" onclick="huyChamCa('${l.maLop}','${st.maNV}')">Hủy</button>`

    <span style="margin-left:auto"><b style="color:var(--p1)">${money(r.tong)} đ</b></span></div>`).join('');
  const staffRows = (D.nhanSu || []).map(s => `
    <div class="lrow"><span><b style="color:var(--ink)">${esc(s.hoTen)}</b><br><small style="color:var(--muted)">${esc(s.vaiTro)} · ${money(s.luongCa)} đ/ca · phụ cấp ${money(s.phuCap)} đ</small></span>
    <span style="margin-left:auto;display:flex;gap:8px"><button class="mini" onclick="editStaff('${s.maNV}')">Sửa</button><button class="mini" style="border-color:var(--red-bg);color:var(--red)" onclick="delStaff('${s.maNV}')">Xóa</button></span></div>`).join('');
  return backHead('Chấm công & lương') + mnavHTML() + `
  <div class="kpis">

    <div class="kpi"><div class="ic g2">${I.check}</div><div class="lb">Tổng ca dạy tháng</div><div class="vl">${sal.tongCa}<small> ca · ${sal.tongGio}h</small></div></div>
    <div class="kpi" style="grid-column:1/-1"><div class="ic g3">${I.wallet}</div><div class="lb">Tổng lương ${monthName(S.month)}</div><div class="vl">${money(sal.tong)}<small> đ</small></div></div>
  </div>
  <div class="secttl">Chấm công theo ca dạy</div>
  <div class="mnav" style="margin-bottom:10px"><span style="font-size:13px;color:var(--muted);font-weight:700">Ngày</span>
    <label style="position:relative;cursor:pointer"><b style="color:var(--p1);font-size:14px">${fmtDateVI(S.wdate)}</b>
    <input type="date" value="${S.wdate}" style="position:absolute;inset:-6px;opacity:0;width:100%;cursor:pointer" onchange="S.wdate=this.value;render()"></label></div>
  ${sesRows || '<div class="empty">Ngày này không có ca dạy nào theo lịch tuần</div>'}
  <div class="secttl">Bảng lương · ${monthName(S.month)}</div>
  <div class="panel" style="padding:4px 16px">${salRows || '<div class="empty">Chưa có ca dạy nào được chấm trong tháng</div>'}</div>
  <div class="secttl" style="display:flex;justify-content:space-between;align-items:center">Nhân sự<button class="mini" onclick="addStaff()">＋ Thêm người</button></div>
  <div class="panel" style="padding:4px 16px">${staffRows || '<div class="empty">Chưa có nhân sự — thêm giáo viên để chấm công & tính lương</div>'}</div>`;
}

function addStaff() { staffForm(null); }

async function doSaveStaff(maNV) {
  const hoTen = $('sfName').value.trim();
  if (!hoTen) { toast('Nhập họ tên'); return; }
  const payload = { maNV, hoTen, vaiTro: $('sfRole').value, sdt: $('sfPhone').value.trim(), luongCa: +$('sfCa').value || 0, phuCap: +$('sfPc').value || 0 };
  try {
    if (!DEMO) { const r = await api('saveStaff', [payload]); payload.maNV = r.maNV; }
    else if (!payload.maNV) payload.maNV = 'NV' + String((D.nhanSu || []).length + 1).padStart(3, '0');
    const i = (D.nhanSu || []).findIndex(x => x.maNV === payload.maNV);
    if (i >= 0) D.nhanSu[i] = payload; else (D.nhanSu = D.nhanSu || []).push(payload);
    closeModal(); toast('Đã lưu nhân sự'); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}
async function delStaff(maNV) {
  const s = staffOf(maNV);
  if (!confirm('Xóa ' + s.hoTen + ' khỏi nhân sự? Chấm công của người này cũng bị xóa.')) return;
  try {
    if (!DEMO) await api('deleteStaff', [{ maNV }]);
    D.nhanSu = (D.nhanSu || []).filter(x => x.maNV !== maNV);
    D.chamCong = (D.chamCong || []).filter(x => x.maNV !== maNV);
    toast('Đã xóa nhân sự'); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}

/* ---- 8. DÒNG TIỀN & LÃI / LỖ TỪNG LỚP ---- */
function financeStats(ym) {
  let thuHP = 0;
  D.hocPhi.forEach(h => { if (normYM(h.thang) === ym && h.trangThai === 'Đã đóng') thuHP += +h.soTien || 0; });
  let thuKhac = 0, chiKhac = 0;
  (D.thuChi || []).forEach(t => { if ((t.ngay || '').slice(0, 7) === ym) { if (t.loai === 'Thu') thuKhac += +t.soTien || 0; else chiKhac += +t.soTien || 0; } });
  const luong = salaryMonth(ym).tong;
  const tongThu = thuHP + thuKhac, tongChi = chiKhac + luong;
  return { thuHP, thuKhac, chiKhac, luong, tongThu, tongChi, lai: tongThu - tongChi };
}
function perClassFinance(ym) {
  const chung = (D.thuChi || []).filter(t => (t.ngay || '').slice(0, 7) === ym && t.loai === 'Chi' && !t.maLop)
    .reduce((s, t) => s + (+t.soTien || 0), 0);
  const phanBo = D.lopHoc.length ? chung / D.lopHoc.length : 0;
  return D.lopHoc.map(c => {
    let thu = 0;
    D.hocPhi.forEach(h => { if (normYM(h.thang) === ym && h.trangThai === 'Đã đóng') { const hv = hvOf(h.maHV); if (hv.maLop === c.maLop) thu += +h.soTien || 0; } });
    (D.thuChi || []).forEach(t => { if ((t.ngay || '').slice(0, 7) === ym && t.maLop === c.maLop) { if (t.loai === 'Thu') thu += +t.soTien || 0; } });
    let chi = 0;
    (D.thuChi || []).forEach(t => { if ((t.ngay || '').slice(0, 7) === ym && t.maLop === c.maLop && t.loai === 'Chi') chi += +t.soTien || 0; });
    (D.chamCong || []).forEach(w => { if ((w.ngay || '').slice(0, 7) === ym && w.maLop === c.maLop) chi += +staffOf(w.maNV).luongCa || 0; });
    return { c, thu, chi, phanBo, lai: thu - chi - phanBo };
  });
}
function vTaiChinh() {
  const f = financeStats(S.month);
  const last6 = []; for (let i = 5; i >= 0; i--) last6.push(addMonths(S.month, -i));
  const maxV = Math.max(...last6.map(m => Math.max(financeStats(m).tongThu, financeStats(m).tongChi)), 1);
  const chart = last6.map(m => { const s = financeStats(m);
    const ht = Math.max(4, Math.round(s.tongThu / maxV * 100)), hc = Math.max(4, Math.round(s.tongChi / maxV * 100));
    return `<div class="fc-col"><div class="fc-bars"><div class="fc-bar thu" style="height:${ht}%" title="Thu"></div><div class="fc-bar chi" style="height:${hc}%" title="Chi"></div></div><div class="blb ${m === S.month ? 'cur' : ''}">T${+m.slice(5, 7)}</div></div>`; }).join('');
  const pcl = perClassFinance(S.month).map(r => `
    <div class="lrow"><span><b style="color:var(--ink)">${esc(r.c.tenLop)}</b><br><small style="color:var(--muted)">Thu ${money(r.thu)} · Chi ${money(r.chi)} · Phân bổ ${money(Math.round(r.phanBo))}</small></span>
    <span style="margin-left:auto"><b style="color:${r.lai >= 0 ? 'var(--green)' : 'var(--red)'}">${r.lai >= 0 ? '+' : ''}${money(Math.round(r.lai))} đ</b></span></div>`).join('');
  const txs = (D.thuChi || []).filter(t => (t.ngay || '').slice(0, 7) === S.month)
    .sort((a, b) => b.ngay.localeCompare(a.ngay)).map(t => `
    <div class="frow"><div class="av" style="${t.loai === 'Thu' ? 'background:var(--green-bg);color:var(--green)' : 'background:var(--red-bg);color:var(--red)'}">${t.loai === 'Thu' ? '↓' : '↑'}</div>
      <div class="inf"><b>${esc(t.noiDung || '')}</b><span>${dmy(t.ngay)} · ${t.maLop ? esc(clsOf(t.maLop).tenLop || t.maLop) : 'Chi phí chung'}</span></div>
      <div class="amt"><b style="color:${t.loai === 'Thu' ? 'var(--green)' : 'var(--red)'}">${t.loai === 'Thu' ? '+' : '−'}${money(t.soTien)} đ</b></div>
      <button class="mini" style="border-color:var(--red-bg);color:var(--red)" onclick="delThuChi('${t.maTC}')">Xóa</button></div>`).join('');
  return backHead('Dòng tiền & lãi/lỗ') + mnavHTML() + `
  <div class="kpis">
    <div class="kpi"><div class="ic g2">${I.trend}</div><div class="lb">Tổng thu</div><div class="vl">${money(f.tongThu)}<small> đ</small></div><span class="delta flat">Học phí ${money(f.thuHP)} + khác ${money(f.thuKhac)}</span></div>
    <div class="kpi"><div class="ic g3">${I.wallet}</div><div class="lb">Tổng chi</div><div class="vl">${money(f.tongChi)}<small> đ</small></div><span class="delta flat">Lương GV ${money(f.luong)} + khác ${money(f.chiKhac)}</span></div>
    <div class="kpi" style="grid-column:1/-1"><div class="ic g1">${I.chart}</div><div class="lb">Lãi / lỗ ${monthName(S.month)}</div><div class="vl" style="color:${f.lai >= 0 ? 'var(--green)' : 'var(--red)'}">${f.lai >= 0 ? '+' : ''}${money(f.lai)}<small> đ</small></div></div>
  </div>
  <div class="panel"><h3>${hic(I.chart)}Thu — chi 6 tháng</h3><div class="sub">Mỗi tháng 2 cột: xanh = thu, đỏ = chi</div><div class="fc-chart">${chart}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Thu</span><span><i style="background:var(--red)"></i>Chi</span></div></div>
  <div class="secttl">Lãi / lỗ từng lớp · ${monthName(S.month)}</div>
  <div class="panel" style="padding:4px 16px">${pcl || '<div class="empty">Chưa có lớp</div>'}</div>
  <div class="secttl" style="display:flex;justify-content:space-between;align-items:center">Thu chi khác<button class="mini" onclick="addThuChi()">＋ Thêm khoản</button></div>
  ${txs || '<div class="empty">Tháng này chưa có khoản thu/chi khác. Học phí và lương GV đã tự tính ở trên.</div>'}`;
}
function addThuChi() {
  openModal(`<h3>Thêm khoản thu / chi</h3>
    <label>Loại</label><select id="tcLoai"><option value="Chi">Chi</option><option value="Thu">Thu khác</option></select>

    <label>Nội dung</label><input id="tcNd" placeholder="VD: Thuê phòng, điện nước, in tài liệu...">
    <label>Số tiền (đ)</label><input id="tcAmt" type="number" inputmode="numeric" value="">
    <div class="mrow"><button class="btn-ghost" onclick="closeModal()">Hủy</button>
    <button class="btn" style="flex:2" onclick="doAddThuChi()">Lưu</button></div>`);
}
async function doAddThuChi() {
  const payload = { maTC: '', ngay: $('tcNgay').value || todayStr(), loai: $('tcLoai').value, maLop: $('tcLop').value, noiDung: $('tcNd').value.trim(), soTien: +$('tcAmt').value || 0 };
  if (!payload.noiDung || !payload.soTien) { toast('Nhập nội dung và số tiền'); return; }
  try {
    if (!DEMO) { const r = await api('saveThuChi', [payload]); payload.maTC = r.maTC; }
    else payload.maTC = 'TC' + String((D.thuChi || []).length + 1).padStart(3, '0');
    (D.thuChi = D.thuChi || []).push(payload);
    closeModal(); toast('Đã lưu khoản ' + payload.loai.toLowerCase()); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}
async function delThuChi(maTC) {
  if (!confirm('Xóa khoản thu/chi này?')) return;
  try {
    if (!DEMO) await api('deleteThuChi', [{ maTC }]);
    D.thuChi = (D.thuChi || []).filter(t => t.maTC !== maTC);
    toast('Đã xóa'); render();
  } catch (e) { toast('Lỗi: ' + e.message); }
}

/* ---- 9. PHIẾU THU / BIÊN NHẬN ---- */
let _lastReceipt = null;
function showReceipt(maHV, thang, amt, how, ngayDong) {
  const h = hvOf(maHV), c = clsOf(h.maLop);
  _lastReceipt = { maHV, thang, amt, how, ngayDong };
  const soPhieu = 'PT-' + String(maHV).replace('HV', '') + '-' + String(thang).replace('-', '');
  openModal(`<div class="receipt">
    <div class="rc-head">${esc(CFG.ten)}</div>
    <div class="rc-title">PHIẾU THU HỌC PHÍ</div>
    <div class="rc-no">Số phiếu: ${soPhieu} · Ngày: ${dmy(ngayDong || todayStr())}</div>
    <div class="kv"><span>Học viên</span><b>${esc(h.hoTen)}</b></div>
    <div class="kv"><span>Lớp</span><b>${esc(c.tenLop || '')}</b></div>
    <div class="kv"><span>Tháng</span><b>${monthName(thang)}</b></div>
    <div class="kv"><span>Hình thức</span><b>${esc(how || 'Chuyển khoản')}</b></div>
    <div class="rc-amt">${money(amt)} đ</div>
    <div class="rc-note">Trung tâm đã nhận đủ học phí. Cảm ơn anh/chị!</div></div>
    <div class="mrow"><button class="btn-ghost" onclick="closeModal();render()">Đóng</button>
    <button class="btn" style="flex:2" onclick="sendReceiptZalo()">Gửi phiếu qua Zalo</button></div>`);
}
async function sendReceiptZalo() {
  if (!_lastReceipt) return;
  const h = hvOf(_lastReceipt.maHV), c = clsOf(h.maLop);
  const phone = normPhone(h.sdt);
  if (!phone) { toast('Chưa có SĐT phụ huynh'); return; }
  const msg = `${CFG.ten} — PHIẾU THU HỌC PHÍ\n• Học viên: ${h.hoTen} (lớp ${c.tenLop || ''})\n• Tháng: ${monthName(_lastReceipt.thang)}\n• Số tiền: ${money(_lastReceipt.amt)} đ (${_lastReceipt.how || 'Chuyển khoản'})\n• Ngày thu: ${dmy(_lastReceipt.ngayDong || todayStr())}\nTrung tâm đã nhận đủ. Cảm ơn anh/chị!`;
  openCompose(h.maHV, 'phieuthu', msg);
}
function debtByHV() {
  const map = {};
  D.hocPhi.forEach(x => {
    if (x.trangThai !== 'Đã đóng') {
      const ym = normYM(x.thang);
      if (!map[x.maHV]) map[x.maHV] = { tong: 0, thangCu: 0, months: [] };
      map[x.maHV].tong += +x.soTien || 0;
      map[x.maHV].months.push(ym);
      if (ym && ym < curYM()) map[x.maHV].thangCu += +x.soTien || 0;
    }
  });
  return map;
}

})();
